name: SE3010 Quality Demo - Playwright

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-se3010-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-healthcare-system/package-lock.json

      - name: Install dependencies
        working-directory: smart-healthcare-system
        run: npm ci

      - name: Install Playwright browsers
        working-directory: smart-healthcare-system
        run: npx playwright install --with-deps chromium

      # NOTE: Store only sensitive secrets in GitHub Actions Secrets
      - name: Run isolated SE3010 tests
        working-directory: smart-healthcare-system
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SEED_TOKEN: ${{ secrets.ADMIN_SEED_TOKEN }}
        run: npx playwright test --config=se3010-quality-demo/playwright.se3010.config.ts

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: playwright-report-se3010
          path: smart-healthcare-system/playwright-report-se3010/